name: WY Main Release

on:
  push:
    branches: [wy-main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            build-essential ninja-build ccache \
            libvorbis-dev zlib1g-dev libhunspell-dev x11proto-record-dev \
            libxtst-dev liblzo2-dev libbz2-dev \
            libavutil-dev libavformat-dev libeb16-dev \
            libzstd-dev libxkbcommon-dev \
            libxapian-dev libzim-dev libopencc-dev libfmt-dev \
            libtomlplusplus-dev \
            qt6-5compat-dev qt6-base-dev qt6-multimedia-dev \
            qt6-speech-dev qt6-svg-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-webchannel-dev qt6-webengine-dev

      - name: Build
        run: |
          cmake -S . -B build_dir -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build_dir

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: build_dir/goldendict

  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14]
        qt_ver: ["6.8.3"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install --force --overwrite \
            bzip2 create-dmg hunspell libiconv libogg libvorbis \
            libzim lzip ccache opencc fmt ffmpeg@6 tomlplusplus xapian || true

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          arch: clang_64
          modules: qtwebengine qtwebchannel qtpositioning qt5compat qtmultimedia qtimageformats qtspeech

      - name: Build
        run: |
          mkdir build_dir
          export PKG_CONFIG_PATH="`brew --prefix ffmpeg@6`/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake -S . -B build_dir -G Ninja \
            -DWITH_FFMPEG_PLAYER=ON \
            -DWITH_QT_MULTIMEDIA=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="12.0"
          cmake --build build_dir

      - name: Package
        run: cmake --install build_dir/

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.os }}-Qt${{ matrix.qt_ver }}
          path: '*.dmg'

  build-windows:
    runs-on: windows-2022
    strategy:
      matrix:
        qt_ver: ["6.8.3"]
        arch: [win64_msvc2022_64]
        include:
          - arch: win64_msvc2022_64
            vs_arch: amd64
    steps:
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          arch: ${{ matrix.arch }}
          modules: qtwebengine qtwebchannel qtpositioning qt5compat qtmultimedia qtimageformats qtspeech

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vs_arch }}

      - name: Build
        run: |
          New-Item -Path './build_dir' -ItemType Directory
          cmake -S . -B "./build_dir" -G Ninja `
            -DCMAKE_C_COMPILER="cl.exe" -DCMAKE_CXX_COMPILER="cl.exe" `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DWITH_FFMPEG_PLAYER=OFF
          cmake --build "./build_dir"

      - name: Package
        run: |
          cd './build_dir'
          cpack --verbose

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}-Qt${{ matrix.qt_ver }}
          path: |
            ./build_dir/*.exe
            ./build_dir/*.7z

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version
        run: echo "version=$(xargs < VERSION)" >> $GITHUB_ENV

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA_SHORT=$(git rev-parse --short=10 HEAD)
          TAG="v${{ env.version }}-alpha.$SHA_SHORT"
          gh release create "$TAG" \
            -t "Goldendict-ng WY fork build $TAG" \
            --target wy-main \
            --prerelease \
            --latest=false \
            --repo ${{ github.repository }}

      - name: Upload artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA_SHORT=$(git rev-parse --short=10 HEAD)
          TAG="v${{ env.version }}-alpha.$SHA_SHORT"
          gh release upload "$TAG" --repo ${{ github.repository }} --clobber \
            *.exe *.7z *.dmg goldendict
