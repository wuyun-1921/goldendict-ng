name: WY Main Release

on:
  push:
    branches: [wy-main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libbz2-dev liblzma-dev libhunspell-dev \
            libvorbis-dev libogg-dev \
            libx11-dev libxtst-dev \
            libopencc-dev libfmt-dev \
            libtomlplusplus-dev \
            libxapian-dev libzim-dev \
            libeb-dev \
            qt6-base-dev qt6-webengine-dev qt6-webchannel-dev \
            qt6-positioning-dev qt6-multimedia-dev \
            qt6-speech-dev qt6-tools-dev qt6-image-formats-plugins \
            qt6-core5compat-dev \
            libqt6webenginecore6 libqt6webenginewidgets6 \
            libqt6webchannel6 libqt6positioning6 \
            libqt6multimedia6 libqt6multimediawidgets6 \
            libqt6texttospeech6 libqt6core5compat6 || true

      - name: Build
        run: |
          cmake -S . -B build_dir -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build_dir

      - name: Package
        run: |
          cd build_dir
          cmake --install . --prefix redist

      - uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: build_dir/goldendict

  build-macos:
    runs-on: macos-14
    strategy:
      matrix:
        qt_ver: ["6.8.3"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install dependencies
        run: |
          brew install --force --overwrite \
            bzip2 hunspell libiconv libogg libvorbis \
            libzim lzip opencc fmt tomlplusplus xapian \
            create-dmg || true

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          arch: clang_64
          modules: qtwebengine qtwebchannel qtpositioning qt5compat qtmultimedia qtimageformats qtspeech

      - name: Build
        run: |
          cmake -S . -B build_dir -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="12.0" \
            -DWITH_FFMPEG_PLAYER=OFF
          cmake --build build_dir

      - name: Package
        run: cmake --install build_dir/

      - uses: actions/upload-artifact@v7
        with:
          name: macos-Qt${{ matrix.qt_ver }}
          path: '*.dmg'

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtpositioning qt5compat qtmultimedia qtimageformats qtspeech

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Build
        run: |
          cmake -S . -B build_dir -G Ninja `
            -DCMAKE_C_COMPILER="cl.exe" -DCMAKE_CXX_COMPILER="cl.exe" `
            -DCMAKE_BUILD_TYPE=Release `
            -DWITH_FFMPEG_PLAYER=OFF
          cmake --build build_dir

      - name: Package
        run: |
          cd build_dir
          cpack --verbose

      - uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: |
            build_dir/*.exe
            build_dir/*.7z

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version
        run: echo "version=$(xargs < VERSION)" >> $GITHUB_ENV

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA_SHORT=$(git rev-parse --short=10 HEAD)
          TAG="v${{ env.version }}-alpha.$SHA_SHORT"
          gh release create "$TAG" \
            -t "WY build $TAG" \
            --target wy-main \
            --prerelease \
            --latest=false \
            --repo ${{ github.repository }}

      - name: Upload artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA_SHORT=$(git rev-parse --short=10 HEAD)
          TAG="v${{ env.version }}-alpha.$SHA_SHORT"
          gh release upload "$TAG" --repo ${{ github.repository }} --clobber \
            *.exe *.7z *.dmg goldendict
