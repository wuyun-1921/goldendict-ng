name: WY Main Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git cmake ninja automake autoconf libtool \
            git cmake ninja \
            hunspell libvorbis libxtst lzo zlib \
            tomlplusplus fmt opencc xapian-core libzim \
            qt6-base qt6-svg qt6-multimedia qt6-webengine qt6-speech qt6-5compat qt6-tools

      - name: Install libeb from archlinuxcn
        run: |
          echo >> /etc/pacman.conf
          echo '[archlinuxcn]' >> /etc/pacman.conf
          echo 'SigLevel = Never' >> /etc/pacman.conf
          echo 'Server = https://repo.archlinuxcn.org/$arch' >> /etc/pacman.conf
          pacman -Sy --noconfirm libeb

      - name: Build goldendict with makepkg
        run: |
          chown -R builduser:builduser .
          su builduser -c 'makepkg -s --noconfirm --needed'
          cp *.pkg.tar.zst "$GITHUB_WORKSPACE/"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: linux
          path: '*.pkg.tar.zst'
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: linux
          path: '*.pkg.tar.zst'
          if-no-files-found: warn

  build-macOS:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14]
        qt_ver: ["6.10.3"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install --force --overwrite \
            bzip2 \
            create-dmg \
            hunspell \
            libiconv \
            libogg \
            libvorbis \
            libzim \
            lzip \
            ccache \
            opencc \
            fmt \
            ffmpeg@6 \
            tomlplusplus \
            xapian || true

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.qt_ver }}

      - name: Cache EB
        id: cache-eb
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/libeb*
            /usr/local/include/eb
            /usr/local/bin/eb*
          key: ${{ runner.os }}-${{ runner.arch }}-eb-custom

      - name: Install EB
        if: steps.cache-eb.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/xiaoyifang/eb.git
          cd eb && ./configure && make -j$(sysctl -n hw.ncpu) && sudo make install && cd ..

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          arch: clang_64
          modules: qtwebengine qtwebchannel qtpositioning qt5compat qtmultimedia qtimageformats qtspeech

      - name: Build
        run: |
          mkdir build_dir
          export PKG_CONFIG_PATH="`brew --prefix ffmpeg@6`/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake -S . -B build_dir -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DWITH_FFMPEG_PLAYER=ON \
            -DWITH_QT_MULTIMEDIA=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="12.0"
          cmake --build build_dir

      - name: Package
        run: |
          cmake --install build_dir/

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: macOS-${{ matrix.os }}-Qt${{ matrix.qt_ver }}
          if-no-files-found: warn
          retention-days: 7
          archive: false
          path: '*.dmg'

  build-Windows:
    permissions:
      contents: read
    runs-on: windows-2022
    strategy:
      matrix:
        qt_ver: ["6.10.3"]
        arch: [win64_msvc2022_64]
        include:
          - arch: win64_msvc2022_64
            vs_arch: amd64
    steps:
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          arch: ${{ matrix.arch }}
          modules: qtwebengine qtwebchannel qtpositioning qt5compat qtmultimedia qtimageformats qtspeech

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vs_arch }}

      - name: Build
        id: build
        run: |
          New-Item -Path './build_dir' -ItemType Directory
          cmake -S . -B "./build_dir" -G Ninja `
            -DCMAKE_C_COMPILER="cl.exe" -DCMAKE_CXX_COMPILER="cl.exe" `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DWITH_FFMPEG_PLAYER=OFF
          cmake --build "./build_dir"

      - name: Package
        run: |
          cd './build_dir'
          cpack --verbose

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: Windows-${{ matrix.arch }}-Qt${{ matrix.qt_ver }}-installer
          if-no-files-found: warn
          retention-days: 7
          path: ./build_dir/*.exe

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: Windows-${{ matrix.arch }}-Qt${{ matrix.qt_ver }}-portable
          if-no-files-found: warn
          retention-days: 7
          path: ./build_dir/*.7z

  setup:
    runs-on: ubuntu-24.04
    outputs:
      newTag: ${{ steps.tag.outputs.newTag }}
    steps:
      - uses: actions/checkout@v6
      - name: Use pushed tag
        id: tag
        run: |
          echo "newTag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

  release:
    needs: [build-linux, build-macOS, build-Windows, setup]
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      newTag: ${{ needs.setup.outputs.newTag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.newTag }}

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          merge-multiple: true

      - name: List files
        run: ls -R

      - name: Generate release notes
        id: notes
        run: |
          LAST_TAG=$(git tag --sort=-v:refname --merged HEAD~1 'v*' 2>/dev/null | head -1)
          if [ -z "$LAST_TAG" ]; then
            NOTES="Initial release."
          else
            NOTES="**Changes since $LAST_TAG:**"$'\n'$'\n'
            NOTES+=$(git log --oneline --no-merges "$LAST_TAG..HEAD" | sed 's/^/- /')
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ env.newTag }}' \
            -t "Goldendict-ng WY fork ${{ env.newTag }}" \
            --target wy-main \
            --latest \
            --repo ${{ github.repository }} \
            --notes '${{ steps.notes.outputs.notes }}'

      - name: Upload artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload '${{ env.newTag }}' --repo ${{ github.repository }} --clobber \
            *.exe *.7z *.dmg
